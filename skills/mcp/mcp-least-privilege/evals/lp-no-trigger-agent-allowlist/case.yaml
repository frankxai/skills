schema_version: "1.1"
name: lp-no-trigger-agent-allowlist
description: "Should NOT trigger mcp-least-privilege. (belongs to tool-allowlist)"
tags: [trigger, should-not-trigger]
runs: 1
execution:
  prompt: "set up a default-deny list of which tools my research agent may call for this task"
  max_turns: 4
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?mcp-least-privilege"'
    min: 0
    max: 0
