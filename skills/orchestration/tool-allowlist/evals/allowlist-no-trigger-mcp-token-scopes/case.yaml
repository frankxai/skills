schema_version: "1.1"
name: allowlist-no-trigger-mcp-token-scopes
description: "Should NOT trigger tool-allowlist. (belongs to mcp-least-privilege)"
tags: [trigger, should-not-trigger]
runs: 1
execution:
  prompt: "which GitHub token scopes does the GitHub MCP server need if it should only read issues?"
  max_turns: 4
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?tool-allowlist"'
    min: 0
    max: 0
