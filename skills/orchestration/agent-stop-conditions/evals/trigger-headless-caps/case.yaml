schema_version: "1.1"
name: trigger-headless-caps
description: "Should trigger agent-stop-conditions."
tags: [trigger, should-trigger]
runs: 1
execution:
  prompt: "I'm running claude -p from a cron job. what limits should I set so it can't run forever or overspend, and what do I do when it returns error_max_turns?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-stop-conditions"'
