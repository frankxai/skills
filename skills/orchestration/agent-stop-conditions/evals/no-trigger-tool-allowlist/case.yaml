schema_version: "1.1"
name: no-trigger-tool-allowlist
description: "Should NOT trigger agent-stop-conditions. (tool allowlist question, belongs to another skill)"
tags: [trigger, should-not-trigger]
runs: 1
execution:
  prompt: "which tools should my code-review agent be allowed to use? I want it read-only"
  max_turns: 4
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-stop-conditions"'
    min: 0
    max: 0
