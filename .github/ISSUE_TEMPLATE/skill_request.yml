name: Skill request
description: Propose a new skill or an improvement to an existing one
title: "Skill request: "
labels: [enhancement]
body:
  - type: input
    id: problem
    attributes:
      label: User problem
      description: What decision or task needs better guidance?
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: When should it activate?
      description: Give a realistic user request and the expected outcome.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints or existing solutions
      description: Note relevant tools, permissions, paid services, and similar skills.
